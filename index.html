<!DOCTYPE html>
<html>
<head>
<title>Add Two Numbers</title>
<style>
body { font-family: Arial; padding: 40px; }
input { margin: 5px; }
</style>
</head>
<body>
<h1>Add Two Numbers</h1>
<form id="addForm">
<input type="number" id="num1" placeholder="Number 1" required>
<input type="number" id="num2" placeholder="Number 2" required>
<button type="submit">Add</button>
</form>
<p id="result"></p>
<script>
const form = document.getElementById('addForm');
const result = document.getElementById('result');
form.addEventListener('submit', async (e) => {
e.preventDefault();
const a = document.getElementById('num1').value;
const b = document.getElementById('num2').value;
const apiUrl = "https://cj5ywgoh63.execute-api.ap-south-1.amazonaws.com/prod/add"
try {
const response = await fetch(apiUrl, {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        a: Number(a),
        b: Number(b)
    })
});

console.log("HTTP status:", response.status);

const text = await response.text();
console.log("Raw response:", text);

const data = JSON.parse(text);
console.log("Parsed response:", data);

if (data.sum !== undefined) {
    result.textContent = 'Sum: ' + data.sum;
} else {
    result.textContent = 'Error: ' + (data.error || data.message || text);
}

} catch (err) {
result.textContent = 'Error: ' + err.message;
}
});
</script>
</body>
</html>
